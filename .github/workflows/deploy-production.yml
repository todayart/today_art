name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  # python 버전에 주의
  # 만약 path를 수정해서 backend로 진입할 거라면 sh -c "gunicorn --bind 0.0.0.0:$PORT config.wsgi:application"을 시작 커맨드로 변경해야함
  PYTHON_VERSION: "3.13"
  AZURE_WEBAPP_NAME: todayart-backend
  AZURE_WEBAPP_PACKAGE_PATH: .

jobs:
  # 바뀐 경로를 보고 배포할 쪽만 고른다.
  # 스킬·문서만 바뀐 머지가 백엔드를 다시 배포하면 Azure F1 하루 CPU 한도를 써서 앱이 멈춘다 (2026-11-18 PR #28).
  # 이 파일 자체가 바뀌거나 수동 실행(workflow_dispatch)이면 둘 다 배포한다.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff against previous main
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          wf='^\.github/workflows/deploy-production\.yml$'
          echo "$files" | grep -qE "^backend/|^requirements\.txt$|$wf" && b=true || b=false
          echo "$files" | grep -qE "^frontend/|$wf" && f=true || f=false
          echo "backend=$b" >> "$GITHUB_OUTPUT"
          echo "frontend=$f" >> "$GITHUB_OUTPUT"
          echo "backend=$b frontend=$f"

  backend:
    name: Deploy Django API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 아래 Azure 단계는 리포 변수 BACKEND_HOST=azure 일 때만 실행됩니다 (2026-11 Azure 복귀 후 설정됨).
      # 변수를 지우면 Azure 배포를 건너뜁니다. 자세한 내용은 .github/workflows/README.md 참고.
      - name: Azure Login
        if: vars.BACKEND_HOST == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ensure backend requirements.txt exists
        run: |
          # 루트 requirements.txt만 있고 backend/requirements.txt가 없는 경우에만 복사
          if [ -f requirements.txt ] && [ ! -f backend/requirements.txt ]; then
            cp requirements.txt backend/requirements.txt
          fi

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Deploy to Azure Web App (OIDC)
        if: vars.BACKEND_HOST == 'azure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  frontend:
    name: Trigger Vercel Production Deploy
    runs-on: ubuntu-latest
    needs: [changes, backend]
    # 백엔드가 건너뛰어져도 프론트는 배포한다. 백엔드가 실패하면 배포하지 않는다.
    if: >-
      !cancelled()
      && needs.changes.outputs.frontend == 'true'
      && (needs.backend.result == 'success' || needs.backend.result == 'skipped')

    environment: production

    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Ensure deploy hook secret exists
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK secret is missing." >&2
            exit 1
          fi

      - name: Trigger Vercel redeploy
        run: curl -s -X POST "$VERCEL_DEPLOY_HOOK"
